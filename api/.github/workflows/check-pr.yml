name: pr-check

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify
      run: |
        code-verify
